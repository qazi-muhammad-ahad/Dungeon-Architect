name: Build and verify
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: cmake -S . -B build/native-ci -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build/native-ci --parallel 2
      - run: ctest --test-dir build/native-ci --output-on-failure
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: bash tools/build-vercel.sh
      - run: ../../.tools/flutter/bin/flutter analyze
        working-directory: apps/flutter_ui
      - run: ../../.tools/flutter/bin/flutter test
        working-directory: apps/flutter_ui
