name: dungeon_architect
description: Desktop editor for constrained dungeon generation and exact encounter allocation.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 6.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: NotoSansSymbols2
      fonts:
        - asset: assets/fonts/NotoSansSymbols2-Regular.ttf
  assets:
    - assets/phase08-teaching.json
    - assets/phase08-standard-14.json
